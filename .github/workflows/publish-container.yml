name: Publish container

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release version and define image tags
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must have the form vMAJOR.MINOR.PATCH: ${tag}" >&2
            exit 1
          fi

          project_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "${version}" != "${project_version}" ]]; then
            echo "Tag ${tag} does not match pyproject.toml version ${project_version}." >&2
            exit 1
          fi

          minor="${version%.*}"
          image="ghcr.io/potatoes1286/tetolate"
          {
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${image}:${version}"
            echo "${image}:${minor}"
            echo "${image}:latest"
            echo "${image}:sha-${GITHUB_SHA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.description=Self-hosted comic translation pipeline
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        shell: bash
        env:
          IMAGE: ghcr.io/potatoes1286/tetolate:${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          container="tetolate-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="tetolate-smoke-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "${container}" >/dev/null 2>&1 || true
            docker volume rm "${volume}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "${volume}"
          docker run --detach --name "${container}" --volume "${volume}:/data" "${IMAGE}"

          healthy=false
          for _ in {1..60}; do
            if docker exec "${container}" python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/admin', timeout=3).read(1)"; then
              healthy=true
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "${container}")" != "true" ]]; then
              break
            fi
            sleep 2
          done

          if [[ "${healthy}" != "true" ]]; then
            docker logs "${container}" >&2
            exit 1
          fi

          docker exec "${container}" test -f /data/config/vlm_config.json
          docker exec "${container}" test -f /data/config/web_config.json
          docker logs "${container}" 2>&1 | grep -F "default admin password is: changeme"
          test "$(docker inspect --format '{{.State.Running}}' "${container}")" = "true"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image tags
        shell: bash
        env:
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            docker push "${tag}"
          done <<< "${TAGS}"
